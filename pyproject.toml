[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "patchright-cli"
version = "0.1.0"
description = "Stealth browser automation CLI powered by Patchright"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "patchright>=1.49.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[project.scripts]
patchright-cli = "patchright_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["patchright_cli*"]
